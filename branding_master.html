<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior SafeSurf Branding Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0f172a;
        }

        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: white;
            text-align: center;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
        }

        /* The exact SVG from options.html but scaled up */
        .shield-icon {
            filter: drop-shadow(0 0 30px rgba(16, 185, 129, 0.3));
        }

        .text {
            font-size: 120px;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
        }

        .instructions {
            position: fixed;
            bottom: 40px;
            color: #64748b;
            font-size: 18px;
            font-weight: 400;
        }
    </style>
</head>

<body>
    <div class="logo-container">
        <svg class="shield-icon" width="400" height="400" viewBox="0 0 24 24" fill="#10b981" stroke="#10b981"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        <h1 class="text">Senior SafeSurf</h1>
    </div>
    <div class="instructions">
        Screenshot the shield area in a square to create <b>icon128.png</b>
    </div>
</body>

</html>
