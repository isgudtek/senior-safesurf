<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior SafeSurf | Site Blocked</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg: #020617;
            --glass-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg);
            font-family: 'Outfit', system-ui, sans-serif;
            color: var(--text-main);
            overflow: hidden;
            position: relative;
        }

        #bgContainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: opacity 1s ease-in-out;
        }

        /* Ambient Glow Objects */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(60px);
            animation: float 20s infinite alternate ease-in-out;
            opacity: 0.5;
        }

        .glow-1 {
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            bottom: -100px;
            right: -100px;
            animation-delay: -5s;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0) scale(1);
            }

            100% {
                transform: translate(100px, 50px) scale(1.2);
            }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 60px 40px;
            max-width: 520px;
            width: 90%;
            background: var(--glass-bg);
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Pulsing Shield Icon */
        .shield-container {
            margin-bottom: 24px;
            position: relative;
            display: inline-block;
        }

        .shield-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--primary);
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0;
            animation: shieldPulse 3s infinite;
        }

        @keyframes shieldPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }

            50% {
                opacity: 0.3;
            }

            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }

        .icon svg {
            width: 84px;
            height: 84px;
            stroke: var(--primary);
            fill: rgba(16, 185, 129, 0.05);
            stroke-width: 1.5;
            filter: drop-shadow(0 0 10px var(--primary-glow));
        }

        h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.04em;
            background: linear-gradient(to bottom, #fff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .message {
            font-size: 18px;
            color: var(--text-muted);
            margin-bottom: 32px;
            line-height: 1.6;
            font-weight: 400;
        }

        .domain-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.1);
            padding: 10px 20px;
            border-radius: 100px;
            border: 1px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 40px;
        }

        .domain-label {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .domain-name {
            font-family: 'Monaco', monospace;
            font-size: 14px;
            color: #fff;
        }

        .continue-btn {
            display: block;
            width: 100%;
            padding: 18px 32px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            color: var(--text-muted);
            font-family: 'Outfit', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            opacity: 0;
            animation: fadeIn 1s 1s forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .continue-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        /* Branding & Attribution */
        .footer-nav {
            position: fixed;
            bottom: 40px;
            width: 100%;
            padding: 0 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            z-index: 20;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .brand span {
            color: var(--primary);
            font-weight: 800;
        }

        .attribution {
            background: rgba(15, 23, 42, 0.4);
            padding: 6px 14px;
            border-radius: 100px;
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            transition: all 0.3s;
        }

        .attribution:hover {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
        }

        .attribution a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        /* Focus Particles */
        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .ai-reason {
            white-space: pre-line;
            margin: 0 auto 24px; max-width: 520px; padding: 16px 20px; border-radius: 16px;
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 18px; line-height: 1.5; color: #f8fafc; backdrop-filter: blur(8px);
        }
        .ai-engine { margin-top: 8px; font-size: 13px; color: rgba(248, 250, 252, 0.7); }

        .particle {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            opacity: 0.1;
            bottom: -20px;
            animation: rise 15s infinite linear;
        }

        @keyframes rise {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-110vh);
            }
        }
    </style>
</head>

<body>
    <div id="bgContainer"></div>
    <div id="particles"></div>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="container">
        <div class="shield-container">
            <div class="shield-pulse"></div>
            <div class="icon">
                <svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
            </div>
        </div>

        <h1>Stay the course.</h1>
        <p class="message">This path is currently protected to safeguard your focus. Take a deep breath.</p>

        <div id="aiReason" class="ai-reason hidden">
            <div id="aiReasonText"></div>
            <div id="aiEngine" class="ai-engine"></div>
        </div>

        <div class="domain-box">
            <span class="domain-label">Protected</span>
            <span class="domain-name" id="blockedDomain">...</span>
        </div>

        <button class="continue-btn" id="continueBtn">Mindful Override</button>
        <button class="continue-btn hidden" id="backBtn"
            style="background: var(--primary); color: #fff; margin-top: 12px; opacity: 1; animation: none;">Go
            Back</button>
    </div>

    <div class="footer-nav">
        <div class="brand"
            style="font-family: 'Outfit', sans-serif; text-transform: none; font-weight: 400; font-size: 16px;">
            SafeNet<span> Senior</span>
        </div>
        <div id="authorAttribution" class="attribution hidden">
            Captured by <a id="authorLink" href="#" target="_blank">Author</a> on Pexels
        </div>
    </div>

    <script src="js/security.js"></script>
    <script src="blocked.js"></script>
</body>

</html>
